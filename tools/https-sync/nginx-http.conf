# Separate HTTP challenge vhost; leave default and phos hosts untouched.
server {
    listen 80;
    server_name sync-check.sakiehome.icu;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/sakie-sync-acceptance/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
