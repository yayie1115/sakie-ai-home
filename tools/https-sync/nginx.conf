# Separate server block only. No include into phos or current default server.
server {
    listen 443 ssl;
    server_name sync-check.sakiehome.icu;
    ssl_certificate /etc/letsencrypt/live/sync-check.sakiehome.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync-check.sakiehome.icu/privkey.pem;
    access_log off;
    error_log /var/log/nginx/sakie-sync-acceptance.error.log warn;
    client_max_body_size 1m;
    location = /api { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3301;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_redirect off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
