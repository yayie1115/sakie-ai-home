let groupRemarks={group:{'谢亦言':'谢亦言','慕遥':'慕遥'}};let editingGroupMember='';let pending={yan:[],group:[]},selected='yan',mobile=false,listOpen=false,panel='',modal='',menuTarget=null,replyTo='',searchTerm='',trash=[],nextId=100;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const conv=()=>conversations.find(c=>c.id===selected);function icon(c){return c.type==='group'?'群':c.name.slice(0,1)}function avatar(who,name){return `<div class="avatar ${who==='me'?'me':''}">${who==='me'?'我':esc(name==='慕遥'?'慕':name?.slice(0,1)||'群')}</div>`}
