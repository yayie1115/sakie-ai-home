# REVIEW TEMPLATE ONLY. Integrate in the existing approved main-domain vhost.
# Do not install alongside a second server block for the same hostname.
# Preserve every unrelated vhost, especially phos.sakiehome.icu.
server {
    listen 443 ssl;
    server_name sakiehome.icu;
    ssl_certificate /etc/letsencrypt/live/sakiehome.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakiehome.icu/privkey.pem;
    access_log off;
    client_max_body_size 1m;
    location = /ws { return 404; }
    location ^~ /ws/ { return 404; }
    # All routes use the same frontend gateway; it owns static files and /api/.
    # Do not add a host-side root/alias/try_files or an index.html error_page here.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header Upgrade "";
    proxy_read_timeout 90s;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;

    location = /api { return 308 /api/; }
    # No URI suffix on proxy_pass: preserve /assets/ and /api/ upstream paths.
    location ^~ /assets/ { proxy_pass http://127.0.0.1:3402; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:3402; }
    location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|wasm)$ {
        proxy_pass http://127.0.0.1:3402;
    }
    # Only the frontend container decides whether an application route uses SPA fallback.
    location / { proxy_pass http://127.0.0.1:3402; }
}
