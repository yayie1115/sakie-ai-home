# Explicit opt-in template; does not replace compose.yaml or any host site.
name: sakie-chat-web
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ${SAKIE_BACKEND_ENV_FILE:?Absolute path to private backend env file required}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      RUNTIME_ROLE: cloud
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Exact HTTPS origin required}
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/sakie.db
      BACKUP_DIR: /app/backups
      OWNER_CREDENTIAL_FILE: /run/sakie/owner.json
    volumes:
      - type: bind
        source: ${SAKIE_CLOUD_DATA_DIR:?Approved persistent cloud data directory required}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${SAKIE_CLOUD_BACKUP_DIR:?Approved backup directory required}
        target: /app/backups
        bind:
          create_host_path: false
      - type: bind
        source: ${SAKIE_OWNER_FILE:?Existing private owner credential file required}
        target: /run/sakie/owner.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 96
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${SAKIE_CHAT_HTTP_PORT:-3402}:80"
    volumes:
      - type: bind
        source: ./chat.frontend.nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
