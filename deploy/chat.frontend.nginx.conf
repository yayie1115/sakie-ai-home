# Only behind the HTTPS host proxy; container port is loopback-bound.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    client_max_body_size 1m;
    location = /api { return 308 /api/; }
    location = /ws { return 404; }
    location ^~ /ws/ { return 404; }
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_cache off;
    }
    # Build assets must never fall back to the SPA document, including stale hashes.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|wasm)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
    # Only application routes (for example /chat) use the SPA fallback.
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store" always; }
}
